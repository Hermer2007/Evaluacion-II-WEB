<div class="max-w-6xl mx-auto p-6">

  <h1 class="text-3xl font-extrabold text-slate-800 mb-8 border-b-4 border-blue-500 inline-block">
    Staff
  </h1>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    @for (personaje of personajes; track personaje.id){
      <div class="border-2 border-gray-300 bg-cyan-50 rounded-lg p-3">
        <img
          class="h-60 w-full object-contain rounded-lg mx-auto"
          [src]="personaje.image"
          [alt]="personaje.name"
        >
        <h2 class="text-center font-bold text-lg mt-3">
          {{personaje.name}}
        </h2>
        <p class="text-center text-gray-600 mt-2">
          Género: {{personaje.gender}}
        </p>
      </div>
    }
  </div>
</div>
