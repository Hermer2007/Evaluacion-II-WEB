<div class="max-w-3xl mx-auto p-6 bg-slate-50 min-h-screen">
  <h1 class="text-3xl font-extrabold text-slate-800 mb-8 border-b-4 border-indigo-500 inline-block">
    Registro de Usuarios
  </h1>
  <div class="bg-white p-6 rounded-2xl shadow-xl border border-slate-200">
    <h2 class="text-xl font-bold text-slate-700 mb-4">
      Nuevo Usuario
    </h2>
    <form
      (ngSubmit)="registrarUsuario()"
      class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <input
        [(ngModel)]="nuevoUsuario.username"
        name="username"
        type="text"
        placeholder="Username"
        required
        class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none"
      >
      <input
        [(ngModel)]="nuevoUsuario.password"
        name="password"
        type="password"
        placeholder="Contraseña"
        required
        class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none"
      >
      <button
        type="submit"
        class="md:col-span-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow">
        REGISTRAR
      </button>
    </form>
  </div>
</div>
