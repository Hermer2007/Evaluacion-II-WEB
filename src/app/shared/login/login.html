<div class="max-w-sm mx-auto mt-20 p-6 bg-white border border-gray-200 rounded-2xl shadow-lg">
  <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">
    Inicio de Sesión
  </h1>
  <form (ngSubmit)="iniciarSecion()">
    <div class="mb-5">
      <label class="block mb-2.5 text-sm font-medium text-gray-700">
        Ingrese su username
      </label>
      <input
        [(ngModel)]="username"
        name="username"
        type="text"
        class="bg-cyan-100 border border-gray-300 text-gray-900 text-sm rounded-2xl block w-full px-3 py-2.5 shadow"
        placeholder="Username"
        required
      />
    </div>
    <div class="mb-5">
      <label class="block mb-2.5 text-sm font-medium text-gray-700">
        Ingrese su contraseña
      </label>
      <input
        [(ngModel)]="password"
        name="password"
        type="password"
        class="bg-cyan-100 border border-gray-300 text-gray-900 text-sm rounded-2xl block w-full px-3 py-2.5 shadow"
        placeholder="••••••••"
        required
      />
    </div>
    <button
      type="submit"
      class="w-full rounded-2xl text-white bg-blue-600 hover:bg-blue-700 font-medium text-sm px-4 py-2.5">
      Iniciar Sesión
    </button>
  </form>
</div>
